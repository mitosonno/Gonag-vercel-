<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FCFAF6" />
    <title>QONAQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; background: #FCFAF6; }

      /* İlk yükləmə animasiyası — JS gələnə qədər görünür, React onu avtomatik əvəz edir */
      .boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
      .boot-ring { position: relative; width: 200px; height: 200px; }
      .boot-table {
        position: absolute; left: 50%; top: 50%; width: 86px; height: 86px; margin: -43px 0 0 -43px;
        border-radius: 50%; border: 2px solid #80653C;
        background: radial-gradient(circle at 35% 30%, #FFFFFF, #F5EFE2);
        box-shadow: 0 8px 20px -6px rgba(60,40,20,.25), inset 0 1px 3px rgba(255,255,255,.85);
        animation: bootTable 2.6s cubic-bezier(.34,1.3,.64,1) infinite;
      }
      .boot-seat {
        position: absolute; left: 50%; top: 50%; width: 14px; height: 20px; margin: -10px 0 0 -7px;
        border-radius: 3px 3px 6px 6px; border: .5px solid rgba(150,120,60,.45);
        background: linear-gradient(180deg,#F0E9D8,#D8CFB5);
        animation: bootSeat 2.6s cubic-bezier(.34,1.3,.64,1) infinite;
      }
      .boot-text { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: #80653C; letter-spacing: .5px; }
      @keyframes bootTable {
        0% { transform: scale(0); } 25%, 80% { transform: scale(1); } 100% { transform: scale(0); }
      }
      @keyframes bootSeat {
        0%   { transform: rotate(var(--a)) translateY(-280px) rotate(0); opacity: 0; }
        30%, 80% { transform: rotate(var(--a)) translateY(-84px); opacity: 1; }
        100% { transform: rotate(var(--a)) translateY(-280px); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-ring">
          <div class="boot-seat" style="--a:0deg;animation-delay:0s"></div>
          <div class="boot-seat" style="--a:45deg;animation-delay:.08s"></div>
          <div class="boot-seat" style="--a:90deg;animation-delay:.16s"></div>
          <div class="boot-seat" style="--a:135deg;animation-delay:.24s"></div>
          <div class="boot-seat" style="--a:180deg;animation-delay:.32s"></div>
          <div class="boot-seat" style="--a:225deg;animation-delay:.40s"></div>
          <div class="boot-seat" style="--a:270deg;animation-delay:.48s"></div>
          <div class="boot-seat" style="--a:315deg;animation-delay:.56s"></div>
          <div class="boot-table"></div>
        </div>
        <div class="boot-text">Yüklənir...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
